<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8fd3f4">
<title>Saule · Новогодняя карта Funky Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=Rubik:wght@600;800;900&family=Nunito:wght@600;700;800;900&display=swap&subset=cyrillic">
<style>
/* One app, four screens: start, map, mini-game, final. Everything sits on a winter sky with falling snow. */
:root{
  --red:#E0262F;--red2:#A3141C;--green:#1F8A43;--green2:#12602D;--gold:#FFC93C;--gold2:#E09A00;
  --sky1:#8fd3f4;--sky2:#d9f1ff;--snow:#fff;--ink:#3A1A16;--muted:#7A5B50;--cream:#FFF8EE;
  --font-title:"Rubik Bubbles","Rubik",system-ui,sans-serif;--font-head:"Rubik",system-ui,sans-serif;--font-body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:16px/1.45 var(--font-body);color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2) 70%,#fff);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#fx{z-index:90}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:15px 22px;font:900 18px var(--font-head);letter-spacing:.01em;color:#fff;background:linear-gradient(var(--red),#c41a23);box-shadow:0 6px 0 var(--red2),0 10px 18px rgba(163,20,28,.35);transition:transform .1s,box-shadow .1s;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red2)}
.btn.green{background:linear-gradient(#2aa556,var(--green));box-shadow:0 6px 0 var(--green2),0 10px 18px rgba(18,96,45,.3)}
.btn.green:active{box-shadow:0 2px 0 var(--green2)}
.btn.gold{background:linear-gradient(#ffd866,var(--gold));color:#4a2a00;box-shadow:0 6px 0 var(--gold2),0 10px 18px rgba(224,154,0,.3)}
.btn.ghost{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 5px 0 rgba(58,26,22,.15)}
.btn.big{width:100%;padding:18px;font-size:20px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}

/* ---------- start ---------- */
#start .app{justify-content:space-between;text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;margin:6px auto 0;background:#fff;color:var(--red);font:900 15px var(--font-head);padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.title{font:400 clamp(40px,12vw,60px)/.95 var(--font-title);color:#fff;text-shadow:0 4px 0 var(--red2),0 8px 0 rgba(0,0,0,.12);margin:12px 0 0;-webkit-text-stroke:2px var(--red)}
.sub{font:800 18px var(--font-head);color:var(--red2);margin-top:6px}
.heroes{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:4%;}
.heroes img{width:38%;max-width:180px;filter:drop-shadow(0 12px 10px rgba(0,0,0,.25));animation:bounce 2.4s ease-in-out infinite;cursor:pointer;transition:transform .2s}
.heroes img:nth-child(2){animation-delay:.6s}
.heroes img.pick{transform:scale(1.12)}
.heroes::after{content:"";position:absolute;bottom:-6px;left:10%;right:10%;height:30px;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0))}
@keyframes bounce{50%{translate:0 -14px}}
.story{background:rgba(255,255,255,.92);border-radius:24px;padding:12px 14px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(31,80,120,.18);margin:12px 0}
.story b{color:var(--red)}
.heroes .hero-big{width:auto;max-width:86%;height:100%;max-height:420px;object-fit:contain;animation:bounce 2.4s ease-in-out infinite}
.hero-name{margin:6px 0 8px;font:900 22px var(--font-head);color:var(--red2)}
.chips{display:flex;justify-content:center;gap:10px}
.chip{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.1);overflow:hidden;padding:4px;transition:transform .15s}
.chip img{width:100%;height:100%;object-fit:contain;object-position:top}
.chip.on{box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(0,0,0,.1);transform:scale(1.08)}


/* ---------- map ---------- */
#map .app{gap:10px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud .logo{font:400 22px var(--font-title);color:#fff;-webkit-text-stroke:1px var(--red);text-shadow:0 3px 0 var(--red2)}
.stars{display:flex;gap:3px;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.stars i{font-style:normal;font-size:20px;filter:grayscale(1) opacity(.35);transition:filter .5s,transform .5s}
.stars i.on{filter:none;transform:scale(1.12)}
.board{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.mapbox{position:relative;height:100%;max-width:100%;aspect-ratio:572/1024;border-radius:26px;overflow:hidden;box-shadow:0 0 0 5px #fff,0 16px 40px rgba(20,70,110,.35)}
.mapbox>img{width:100%;height:100%;display:block}
.pin{position:absolute;width:15.5%;aspect-ratio:1.2;transform:translate(-50%,-50%);background:url(assets/map_open.webp) no-repeat;border-radius:50%}
.pin.done{animation:pinpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pinpop{from{transform:translate(-50%,-50%) scale(.4)}}
.pin.next{background:none;cursor:pointer}
.pin.next::before,.pin.next::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:4px solid var(--gold);animation:ring 1.4s ease-out infinite}
.pin.next::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.45);opacity:0}}
.walker{position:absolute;width:15%;transform:translate(-50%,-96%);transition:left 1.1s cubic-bezier(.5,0,.3,1),top 1.1s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));z-index:3}
.walker img{width:100%;display:block;animation:waddle .5s ease-in-out infinite alternate}
@keyframes waddle{from{rotate:-4deg}to{rotate:4deg}}
.chest{position:absolute;font-size:clamp(30px,9vw,44px);transform:translate(-50%,-50%);animation:float 2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));z-index:2}
@keyframes float{50%{translate:0 -6px}}
.bubble{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 14px;font:800 14px var(--font-head);box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.bubble.bad{color:var(--red)}.bubble.ok{color:var(--green2)}
.dock{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.dock .btn{padding:13px 6px;font-size:14px;border-radius:18px;white-space:nowrap}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,40,60,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:480px;background:var(--cream);border-radius:28px 28px 0 0;padding:18px 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .35s cubic-bezier(.2,1.2,.4,1);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-card h2{margin:0;font:900 22px var(--font-head);color:var(--red)}
.sheet-card p{margin:0}
.grab{width:44px;height:5px;border-radius:3px;background:#d9c7b0;margin:-6px auto 4px}
.field{font:800 20px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;padding:14px;border-radius:16px;border:3px solid #ecdcc4;background:#fff;color:var(--ink);text-transform:uppercase;width:100%}
.field:focus{border-color:var(--gold);outline:none}
.pcode{font:900 26px ui-monospace,Menlo,monospace;text-align:center;background:#fff;border:3px dashed var(--gold);border-radius:18px;padding:12px;letter-spacing:.05em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:14px;color:var(--muted);font-weight:700}
.msg{font:800 15px var(--font-head);min-height:1.3em;text-align:center}
.msg.bad{color:var(--red)}.msg.ok{color:var(--green2)}

/* ---------- mini-game screen ---------- */
#game{z-index:30;background:radial-gradient(120% 70% at 50% 0%,#2b6fb0,#173f75 60%,#0f2b55)}
#game .app{gap:10px;color:#fff}
.g-top{display:flex;align-items:center;gap:10px}
.g-top .num{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(#2aa556,var(--green));box-shadow:0 4px 0 var(--green2);display:grid;place-items:center;font:900 22px var(--font-head)}
.g-top h2{margin:0;font:900 20px/1.1 var(--font-head)}
.g-top small{display:block;font-weight:700;opacity:.8}
.g-hud{display:flex;justify-content:space-between;font:900 18px var(--font-head)}
.g-area{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2)}
.g-area canvas{width:100%;height:100%;display:block;touch-action:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font:400 120px var(--font-title);color:#fff;text-shadow:0 6px 0 var(--red2);z-index:5;pointer-events:none}
.count span{animation:zoom .8s ease-out both}
@keyframes zoom{from{transform:scale(2);opacity:0}30%{opacity:1}to{transform:scale(.9)}}
.rules{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:rgba(15,43,85,.85);z-index:6}
.rules .em{font-size:72px;line-height:1}
.rules p{margin:0;font:800 18px var(--font-head)}
/* memory */
.mem{position:absolute;inset:10px;margin:auto;aspect-ratio:3/4.2;max-height:calc(100% - 20px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.card{perspective:600px;min-height:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center}
.card .f{background:linear-gradient(160deg,var(--red),var(--red2));box-shadow:inset 0 0 0 4px rgba(255,255,255,.4)}
.card .f::after{content:"❄";font-size:34px;color:rgba(255,255,255,.7)}
.card .b{background:#fff;transform:rotateY(180deg);font-size:clamp(30px,9vw,48px)}
.card.done .b{box-shadow:0 0 0 4px var(--gold)}
/* tap */
.flake{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);font-size:44px;display:grid;place-items:center;animation:fin .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes fin{from{transform:translate(-50%,-50%) scale(.2)}}
.flake.pop{animation:fout .25s forwards}
@keyframes fout{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
/* puzzle */
.pz-wrap{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pz-hint{width:84px;height:84px;border-radius:12px;box-shadow:0 0 0 3px #fff;opacity:.95}
.pz{width:100%;max-width:420px;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pz button{background-size:300% 300%;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .15s}
.pz button.sel{transform:scale(.9);box-shadow:0 0 0 4px var(--gold)}
.pz.solved button{box-shadow:none;border-radius:0}

/* ---------- result & final ---------- */
.res{position:fixed;inset:0;z-index:60;background:rgba(15,43,85,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.res-card{width:100%;max-width:400px;background:var(--cream);border-radius:30px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop2 .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.res-card .st{font-size:52px;letter-spacing:4px}
.res-card h2{margin:0;font:400 34px var(--font-title);color:var(--red)}
#final{z-index:20;text-align:center}
#final .app{justify-content:flex-start;gap:12px;overflow-y:auto;padding-bottom:4px}
#final .title{margin-top:4px}
#fin-heroes{flex:none!important;min-height:0!important;height:clamp(110px,20vh,170px)}
#fin-heroes img{height:100%;width:auto;max-width:24%;object-fit:contain}
.prize{background:#fff;border-radius:26px;padding:18px;box-shadow:0 10px 30px rgba(31,80,120,.2);font:800 17px var(--font-head)}
.story-img{height:clamp(140px,26vh,260px);width:auto;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.2);margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<!-- START -->
<section class="screen" id="start" hidden><div class="app">
  <div><span class="brand">Saule · Funky Pop</span>
    <h1 class="title">Новогодняя<br>карта</h1>
    <p class="sub">5 точек · 5 игр · подарок в конце</p></div>
  <div class="heroes" id="heroes"></div>
  <div>
    <p class="hero-name" id="hero-name"></p>
    <div class="chips" id="chips"></div>
    <div class="story">В каждой коробке Funky Pop <b>QR-код</b>. Он открывает точку на карте и новую игру. Пройдите 5 точек и заберите <b>подарок</b>!</div>
    <button class="btn big" id="go" type="button">Начать ✨</button>
  </div>
</div></section>

<!-- MAP -->
<section class="screen" id="map" hidden><div class="app">
  <div class="hud"><span class="logo">Funky Pop</span><div class="stars" id="stars" aria-label="Пройдено точек"></div></div>
  <div class="board"><div class="mapbox" id="mapbox"><img src="assets/map_locked.webp" alt="Карта"><div id="layer"></div><div class="bubble" id="bubble" hidden></div></div></div>
  <div class="dock">
    <button class="btn" id="b-code" type="button">📷 Ввести код</button>
    <button class="btn green" id="b-me" type="button">👤 Мой код</button>
    <button class="btn ghost" id="b-help" type="button">❓ Помощь</button>
  </div>
</div></section>

<!-- MINI-GAME -->
<section class="screen" id="game" hidden><div class="app">
  <div class="g-top"><div class="num" id="g-num">1</div><div><h2 id="g-title"></h2><small id="g-sub"></small></div></div>
  <div class="g-hud"><span id="g-score"></span><span id="g-extra"></span><span id="g-time"></span></div>
  <div class="g-area" id="g-area"></div>
</div></section>

<!-- FINAL -->
<section class="screen" id="final" hidden><div class="app">
  <h1 class="title" style="font-size:clamp(40px,12vw,58px)">Ура!<br>Карта пройдена</h1>
  <div class="heroes" id="fin-heroes"></div>
  <div class="prize" id="prize"></div>
  <img class="story-img" id="story" alt="Картинка для сторис">
  <div class="row2"><button class="btn gold" id="share" type="button">📲 В сторис</button><button class="btn green" id="back" type="button">🗺 К карте</button></div>
</div></section>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>
<div class="res" id="res" hidden><div class="res-card" id="res-card"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
/* ================= settings ================= */
const CFG={
  points:5,
  support:'https://t.me/',                                   // Telegram support bot
  prize:'Покажите этот экран на кассе: подарок от Saule ждёт вас! 🎁',
  heroes:[ // Saule originals; names are working titles until Saule confirms
    {img:'assets/hero_berry.webp',name:'Клубничка'},{img:'assets/hero_cactus.webp',name:'Кактус'},
    {img:'assets/hero_rasp.webp',name:'Малинка'},{img:'assets/hero_wink.webp',name:'Подмигун'}],
  games:[ // one game per point
    {id:'catch',  title:'Лови подарки',     em:'🎁',rule:'Водите героем и ловите подарки. Снежинки отнимают жизнь!'},
    {id:'memory', title:'Найди пары',       em:'🃏',rule:'Открывайте по две карточки и находите одинаковые.'},
    {id:'tap',    title:'Собери снежинки',  em:'❄️',rule:'Нажимайте на снежинки, пока они не растаяли. Подарок даёт 2 очка!'},
    {id:'throw',  title:'Попади снежком',   em:'⛄',rule:'Нажимайте на экран, чтобы бросить снежок в снеговика.'},
    {id:'puzzle', title:'Собери картинку',  em:'🧩',rule:'Меняйте кусочки местами: нажмите на один, потом на другой.'}
  ]
};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get:k=>{try{return localStorage.getItem('saule_'+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('saule_'+k,v)}catch(e){}}};
const MP=[[320,872],[355,657],[355,512],[215,458],[315,222]],MW=572,MH=1024;
let me=null,heroIdx=+(store.get('hero')||0)%CFG.heroes.length;
const heroImg=()=>CFG.heroes[heroIdx].img;

/* ================= snow & confetti ================= */
const snow=$('snow'),sx=snow.getContext('2d');let flakes=[];
function sizeSnow(){const d=devicePixelRatio||1;snow.width=innerWidth*d;snow.height=innerHeight*d;sx.setTransform(d,0,0,d,0,0);
  flakes=Array.from({length:Math.round(innerWidth/9)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1+Math.random()*3,v:.3+Math.random()*.8,w:Math.random()*6}));}
function drawSnow(){sx.clearRect(0,0,innerWidth,innerHeight);sx.fillStyle='#fff';
  for(const f of flakes){if(!reduce){f.y+=f.v;f.w+=.01;f.x+=Math.sin(f.w)*.4;if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth;}}sx.globalAlpha=.5+f.r/8;sx.beginPath();sx.arc(f.x,f.y,f.r,0,7);sx.fill();}
  sx.globalAlpha=1;if(!reduce)requestAnimationFrame(drawSnow);}
addEventListener('resize',sizeSnow);sizeSnow();drawSnow();
const fx=$('fx'),fc=fx.getContext('2d');let parts=[],fxOn=false;
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0);}addEventListener('resize',sizeFx);sizeFx();
function confetti(n=120){if(reduce)return;const C=['#E0262F','#FFC93C','#1F8A43','#fff','#8fd3f4'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-6-Math.random()*10,r:3+Math.random()*4,c:C[i%5],a:1,rot:Math.random()*6});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){fc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.a>.05&&p.y<innerHeight+20);
  for(const p of parts){p.vx*=.98;p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.a-=.008;p.rot+=.2;fc.save();fc.globalAlpha=p.a;fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillStyle=p.c;fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore();}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fc.clearRect(0,0,innerWidth,innerHeight);}}

/* ================= screens ================= */
function show(id){['start','map','game','final'].forEach(s=>$(s).hidden=s!==id);}
let bubT;function bubble(t,c){const b=$('bubble');b.textContent=t;b.className='bubble '+(c||'');b.hidden=false;clearTimeout(bubT);bubT=setTimeout(()=>b.hidden=true,4200);}

function heroesHtml(el,pick){el.innerHTML=CFG.heroes.map((h,i)=>`<img src="${h.img}" alt="${h.name}" data-i="${i}" class="${pick&&i===heroIdx?'pick':''}">`).join('');}
function pickerHtml(){const h=CFG.heroes[heroIdx];
  $('heroes').innerHTML=`<img class="hero-big" src="${h.img}" alt="${h.name}">`;
  $('hero-name').textContent=h.name;
  $('chips').innerHTML=CFG.heroes.map((x,i)=>`<button type="button" class="chip ${i===heroIdx?'on':''}" data-i="${i}" aria-label="${x.name}"><img src="${x.img}" alt=""></button>`).join('');}
function drawMap(anim){
  const n=me?me.points:0;
  $('stars').innerHTML=Array.from({length:CFG.points},(_,i)=>`<i class="${i<n?'on':''}">⭐</i>`).join('');
  let o='';MP.forEach(([x,y],i)=>{const w=MW*.155,h=w/1.2;
    if(i<n)o+=`<div class="pin ${anim&&i===n-1?'done':''}" style="left:${x/MW*100}%;top:${y/MH*100}%;background-size:${MW/w*100}% auto;background-position:${(x-w/2)/(MW-w)*100}% ${(y-h/2)/(MH-h)*100}%"></div>`;
    else if(i===n)o+=`<button class="pin next" type="button" aria-label="Следующая точка" style="left:${x/MW*100}%;top:${y/MH*100}%"></button>`;});
  const g=MP[4];o+=`<span class="chest" style="left:${(g[0]+92)/MW*100}%;top:${(g[1]-8)/MH*100}%">${n>=CFG.points?'🎉':'🎁'}</span>`;
  $('layer').innerHTML=o+`<div class="walker" id="walker"><img src="${heroImg()}" alt=""></div>`;
  const from=MP[Math.max(0,Math.min(anim?n-1:n,4))],to=MP[Math.min(n,4)],wk=$('walker');
  const place=p=>{wk.style.left=(p[0]+70)/MW*100+'%';wk.style.top=(p[1]+16)/MH*100+'%';};
  place(from);if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>place(to)));
  const nx=$('layer').querySelector('.pin.next');if(nx)nx.onclick=openCode;
}

/* ================= api ================= */
async function call(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===429)throw new Error('slow');return r.json();}
async function ensurePlayer(){
  const qs=new URLSearchParams(location.search);
  if(qs.get('p')){try{const r=await call('/api/restore',{pcode:qs.get('p')});if(r.key){store.set('key',r.key);me=r;}}catch(e){}}
  if(!me&&store.get('key')){try{const r=await call('/api/me?key='+encodeURIComponent(store.get('key')));if(r.key)me=r;}catch(e){}}
  if(!me){const r=await call('/api/player',{});store.set('key',r.key);me=r;}
}
const MSG={invalid:['Такого кода нет. Проверьте буквы и цифры.','bad'],taken:['Этот код уже использован другим игроком.','bad'],mine:['Этот код вы уже активировали.',''],full:['Карта уже пройдена! 🎉','ok']};
async function scan(code,msgEl){
  code=String(code||'').trim();if(!code){msgEl&&(msgEl.textContent='Введите код из коробки',msgEl.className='msg bad');return false;}
  let r;try{r=await call('/api/scan',{key:me.key,code});}catch(e){const t=e.message==='slow'?'Слишком много попыток. Попробуйте позже.':'Нет связи. Проверьте интернет.';msgEl?(msgEl.textContent=t,msgEl.className='msg bad'):bubble(t,'bad');return false;}
  me={...me,...r};
  if(r.status!=='new'){const[t,c]=MSG[r.status]||['Что-то пошло не так','bad'];if(msgEl){msgEl.textContent=t;msgEl.className='msg '+c;}else bubble(t,c);drawMap(false);return false;}
  closeSheet();await playPoint(r.point);return true;
}

/* ================= sheets ================= */
function openSheet(html){$('sheet-card').innerHTML='<div class="grab"></div>'+html;$('sheet').hidden=false;}
function closeSheet(){$('sheet').hidden=true;}
$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet();};
function openCode(){openSheet(`<h2>Код из коробки</h2><p class="small">Наведите камеру телефона на QR в коробке. Или введите код, который напечатан под QR:</p>
  <input class="field" id="f-code" placeholder="SL-XXXX-XXXX" maxlength="16" autocomplete="off" inputmode="text"><div class="msg" id="f-msg"></div>
  <button class="btn big" id="f-go" type="button">Открыть точку</button>`);
  const f=$('f-code');f.focus();const go=()=>scan(f.value,$('f-msg'));$('f-go').onclick=go;f.onkeydown=e=>{if(e.key==='Enter')go();};}
function openMe(){const link=`${location.origin}${location.pathname}?p=${encodeURIComponent(me.pcode)}`,txt='Моя новогодняя карта Saule: '+link;
  openSheet(`<h2>Мой код игрока</h2><div class="pcode">${me.pcode}</div>
  <p class="small">По этому коду игра продолжится на другом телефоне. Отправьте ссылку себе:</p>
  <div class="row2"><a class="btn green" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">WhatsApp</a><a class="btn green" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Моя новогодняя карта Saule')}">Telegram</a></div>
  <details><summary class="small">Продолжить игру с другого телефона</summary><div style="display:grid;gap:8px;margin-top:8px"><input class="field" id="f-p" placeholder="ЁЛКА-1234-ABC"><div class="msg" id="f-pm"></div><button class="btn ghost" id="f-pg" type="button">Продолжить</button></div></details>`);
  $('f-pg').onclick=async()=>{try{const r=await call('/api/restore',{pcode:$('f-p').value});if(!r.key){$('f-pm').textContent='Код игрока не найден';$('f-pm').className='msg bad';return;}
    store.set('key',r.key);me=r;closeSheet();drawMap(false);bubble('Прогресс восстановлен!','ok');}catch(e){$('f-pm').textContent='Не получилось, попробуйте позже';$('f-pm').className='msg bad';}};}
function openHelp(){openSheet(`<h2>Помощь</h2>
  <p>🎁 В каждой коробке Funky Pop свой QR-код. Один код открывает одну точку.</p>
  <p>📱 Открывайте игру камерой телефона, в Safari или Chrome: так прогресс сохраняется.</p>
  <p>👤 Играете на другом телефоне? Откройте «Мой код» и отправьте ссылку себе.</p>
  <a class="btn big" href="${CFG.support}" target="_blank" rel="noopener">💬 Написать в поддержку</a>`);}
$('b-code').onclick=openCode;$('b-me').onclick=openMe;$('b-help').onclick=openHelp;

/* ================= mini-games ================= */
let stopGame=null;
function result(win,point){return new Promise(res=>{$('res-card').innerHTML=win
  ?`<div class="st">⭐⭐⭐</div><h2>Точка ${point}!</h2><p style="font-weight:800">${point>=CFG.points?'Вы прошли всю карту!':'Отлично! Герой идёт дальше.'}</p><button class="btn big green" id="r-ok" type="button">Дальше →</button>`
  :`<div class="st">❄️</div><h2>Почти!</h2><p style="font-weight:800">Точка уже ваша. Сыграем ещё раз?</p><div class="row2"><button class="btn ghost" id="r-skip" type="button">Пропустить</button><button class="btn" id="r-again" type="button">Ещё раз</button></div>`;
  $('res').hidden=false;if(win)confetti();
  const close=v=>{$('res').hidden=true;res(v);};
  if(win)$('r-ok').onclick=()=>close('ok');else{$('r-again').onclick=()=>close('again');$('r-skip').onclick=()=>close('ok');}});}
async function playPoint(point){
  const g=CFG.games[point-1]||CFG.games[0];
  for(;;){
    show('game');$('g-num').textContent=point;$('g-title').textContent=g.title;$('g-sub').textContent=`Точка ${point} из ${CFG.points}`;
    ['g-score','g-extra','g-time'].forEach(i=>$(i).textContent='');
    const area=$('g-area');area.innerHTML=`<div class="rules"><div class="em">${g.em}</div><p>${g.rule}</p><button class="btn big" id="g-go" type="button">Играть!</button></div>`;
    await new Promise(r=>$('g-go').onclick=r);
    area.innerHTML='<div class="count" id="cnt"></div>';
    for(const t of ['3','2','1']){$('cnt').innerHTML=`<span>${t}</span>`;await sleep(reduce?100:700);}$('cnt').remove();
    const win=await new Promise(res=>{if(store.get('debug'))window.__finish=res;stopGame=GAMES[g.id](area,res)||null;});
    if(stopGame){stopGame();stopGame=null;}
    const a=await result(win,point);if(a==='again')continue;break;
  }
  if(me.points>=CFG.points)return showFinal(true);
  show('map');drawMap(true);bubble(`Точка ${point} открыта! ⭐`,'ok');
}
const timer=(sec,onEnd)=>{const t0=performance.now();let dead=false;const iv=setInterval(()=>{const l=Math.max(0,Math.ceil(sec-(performance.now()-t0)/1000));$('g-time').textContent='⏱ '+l;if(l<=0&&!dead){dead=true;clearInterval(iv);onEnd();}},200);return()=>{dead=true;clearInterval(iv);};};
const canvasIn=area=>{const c=document.createElement('canvas');area.appendChild(c);const r=area.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{c,x,W:r.width,H:r.height};};

const GAMES={
  /* 1. catch gifts */
  catch(area,done){const{c,x,W,H}=canvasIn(area),img=new Image();img.src=heroImg();const GOAL=6;
    let px=W/2,items=[],score=0,lives=3,last=performance.now(),spawn=0,raf,over=false;
    const mv=e=>{const r=c.getBoundingClientRect();px=Math.max(30,Math.min(W-30,e.clientX-r.left));};c.onpointermove=mv;c.onpointerdown=mv;
    const end=w=>{if(over)return;over=true;cancelAnimationFrame(raf);stopT();done(w);};const stopT=timer(20,()=>end(false));
    const hud=()=>{$('g-score').textContent=`🎁 ${score}/${GOAL}`;$('g-extra').textContent='❤️'.repeat(Math.max(0,lives));};hud();
    function fr(t){if(over)return;const dt=Math.min(40,t-last);last=t;spawn-=dt;
      if(spawn<=0){spawn=480;items.push({x:24+Math.random()*(W-48),y:-20,v:.14+Math.random()*.1,bad:Math.random()<.3,s:Math.random()*6});}
      x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';
      for(const it of items){it.y+=it.v*dt;it.s+=.05;x.font=(it.bad?'30px':'34px')+' serif';x.save();x.translate(it.x,it.y);x.rotate(Math.sin(it.s)*.3);x.fillText(it.bad?'❄️':'🎁',0,0);x.restore();
        if(!it.hit&&it.y>H-95&&it.y<H-40&&Math.abs(it.x-px)<42){it.hit=true;it.bad?lives--:score++;hud();}}
      items=items.filter(i=>!i.hit&&i.y<H+30);const hw=72,hh=img.naturalWidth?hw*img.naturalHeight/img.naturalWidth:90;if(img.complete)x.drawImage(img,px-hw/2,H-hh-6,hw,hh);
      if(score>=GOAL)return end(true);if(lives<=0)return end(false);raf=requestAnimationFrame(fr);}
    raf=requestAnimationFrame(fr);return()=>{over=true;cancelAnimationFrame(raf);stopT();};},

  /* 2. memory pairs */
  memory(area,done){const E=['🎄','⛄','🎁','⭐','🍬','🔔'];const deck=[...E,...E].sort(()=>Math.random()-.5);let open=[],found=0,moves=0,lock=false,over=false;const LIM=16;
    area.innerHTML=`<div class="mem">${deck.map((e,i)=>`<button class="card" type="button" data-i="${i}" aria-label="Карточка"><div class="in"><div class="f"></div><div class="b">${e}</div></div></button>`).join('')}</div>`;
    const hud=()=>{$('g-score').textContent=`Пары: ${found}/${E.length}`;$('g-extra').textContent=`Ходы: ${moves}/${LIM}`;};hud();
    const stopT=timer(60,()=>{if(!over){over=true;done(false);}});
    area.querySelector('.mem').onclick=async e=>{const b=e.target.closest('.card');if(!b||lock||over||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');open.push(b);
      if(open.length<2)return;lock=true;moves++;const[a,c]=open;await sleep(500);
      if(deck[a.dataset.i]===deck[c.dataset.i]){a.classList.add('done');c.classList.add('done');found++;}else{a.classList.remove('up');c.classList.remove('up');await sleep(350);}
      open=[];lock=false;hud();if(found===E.length){over=true;stopT();await sleep(400);done(true);}else if(moves>=LIM){over=true;stopT();done(false);}};
    return()=>{over=true;stopT();};},

  /* 3. tap snowflakes */
  tap(area,done){const GOAL=12;let n=0,over=false;const tos=[];
    const hud=()=>$('g-score').textContent=`❄️ ${Math.min(n,GOAL)}/${GOAL}`;hud();
    const end=w=>{if(over)return;over=true;stopT();tos.forEach(clearTimeout);done(w);};const stopT=timer(15,()=>end(false));
    const spawn=()=>{if(over)return;const b=document.createElement('button');b.type='button';b.className='flake';const gift=Math.random()<.18;b.textContent=gift?'🎁':'❄️';
      b.style.left=(12+Math.random()*76)+'%';b.style.top=(12+Math.random()*76)+'%';
      b.onpointerdown=()=>{if(b.classList.contains('pop'))return;b.classList.add('pop');n+=gift?2:1;hud();setTimeout(()=>b.remove(),250);if(n>=GOAL)end(true);};
      area.appendChild(b);tos.push(setTimeout(()=>b.remove(),1250));tos.push(setTimeout(spawn,520));};spawn();
    return()=>{over=true;stopT();tos.forEach(clearTimeout);};},

  /* 4. throw snowballs */
  throw(area,done){const{c,x,W,H}=canvasIn(area);const GOAL=5;let balls=10,hits=0,over=false,raf,last=performance.now();
    const T=[{y:H*.25,x:W*.3,v:.09,d:1},{y:H*.48,x:W*.7,v:.13,d:-1}],shots=[],pops=[];
    const hud=()=>{$('g-score').textContent=`⛄ ${hits}/${GOAL}`;$('g-extra').textContent='⚪'.repeat(balls);};hud();
    const end=w=>{if(over)return;over=true;cancelAnimationFrame(raf);stopT();done(w);};const stopT=timer(30,()=>end(hits>=GOAL));
    c.onpointerdown=e=>{if(over||balls<=0)return;const r=c.getBoundingClientRect();balls--;hud();shots.push({sx:W/2,sy:H-20,tx:e.clientX-r.left,ty:e.clientY-r.top,t:0});};
    function fr(t){if(over)return;const dt=Math.min(40,t-last);last=t;x.clearRect(0,0,W,H);
      x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(W/2,H+30,W*.7,70,0,0,7);x.fill();
      x.textAlign='center';x.textBaseline='middle';
      for(const g of T){g.x+=g.v*dt*g.d;if(g.x<40||g.x>W-40)g.d*=-1;x.font='68px serif';x.fillText('⛄',g.x,g.y);}
      for(const s of shots){s.t+=dt/380;const k=Math.min(1,s.t),px=s.sx+(s.tx-s.sx)*k,py=s.sy+(s.ty-s.sy)*k-Math.sin(k*Math.PI)*60;
        x.fillStyle='#fff';x.beginPath();x.arc(px,py,10*(1-k*.4),0,7);x.fill();x.strokeStyle='#cfe6ff';x.lineWidth=2;x.stroke();
        if(k>=1&&!s.done){s.done=true;const hit=T.find(g=>Math.hypot(g.x-s.tx,g.y-s.ty)<50);if(hit){hits++;pops.push({x:hit.x,y:hit.y,t:0});hud();}else pops.push({x:s.tx,y:s.ty,t:0,miss:1});}}
      for(const p of pops){p.t+=dt;x.globalAlpha=Math.max(0,1-p.t/500);x.font='30px serif';x.fillText(p.miss?'💨':'💥',p.x,p.y-p.t/20);x.globalAlpha=1;}
      if(hits>=GOAL)return end(true);if(balls<=0&&shots.every(s=>s.done))return end(false);raf=requestAnimationFrame(fr);}
    raf=requestAnimationFrame(fr);return()=>{over=true;cancelAnimationFrame(raf);stopT();};},

  /* 5. swap puzzle */
  puzzle(area,done){const N=9;let order=[...Array(N).keys()];do{order.sort(()=>Math.random()-.5);}while(order.every((v,i)=>v===i));
    let sel=null,moves=0,over=false;
    area.innerHTML='<div class="pz-wrap"><img class="pz-hint" src="assets/puzzle.webp" alt="Образец"><div class="pz" id="pz"></div></div>';const pz=$('pz');
    const draw=()=>{pz.innerHTML=order.map((v,i)=>`<button type="button" data-i="${i}" aria-label="Кусочек" style="background-image:url(assets/puzzle.webp);background-position:${(v%3)*50}% ${(Math.floor(v/3))*50}%;background-size:300% 300%"></button>`).join('');
      $('g-score').textContent=`Ходы: ${moves}`;};
    const stopT=timer(90,()=>{if(!over){over=true;done(false);}});draw();
    pz.onclick=async e=>{const b=e.target.closest('button');if(!b||over)return;const i=+b.dataset.i;
      if(sel===null){sel=i;b.classList.add('sel');return;}
      if(sel!==i){[order[sel],order[i]]=[order[i],order[sel]];moves++;}sel=null;draw();
      if(order.every((v,k)=>v===k)){over=true;stopT();pz.classList.add('solved');await sleep(700);done(true);}};
    return()=>{over=true;stopT();};}
};

/* ================= final ================= */
function storyCard(){const c=document.createElement('canvas');c.width=720;c.height=1280;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1280);g.addColorStop(0,'#8fd3f4');g.addColorStop(1,'#ffffff');x.fillStyle=g;x.fillRect(0,0,720,1280);
  x.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<120;i++){x.beginPath();x.arc((i*137)%720,(i*89)%1280,2+i%4,0,7);x.fill();}
  x.textAlign='center';x.fillStyle='#E0262F';x.font='400 92px "Rubik Bubbles", Rubik, sans-serif';x.fillText('Я прошёл',360,200);x.fillText('карту!',360,300);
  const img=new Image();return new Promise(res=>{img.onload=()=>{const w=420,h=w*img.naturalHeight/img.naturalWidth;x.drawImage(img,150,380,w,h);
    x.fillStyle='#3A1A16';x.font='900 46px Rubik, sans-serif';x.fillText('Funky Pop · Saule',360,1140);x.font='700 34px Nunito, sans-serif';x.fillText('Новогодняя карта',360,1200);res(c);};img.src=heroImg();});}
async function showFinal(fresh){show('final');heroesHtml($('fin-heroes'),false);$('prize').textContent=CFG.prize;if(fresh)confetti(200);
  const c=await storyCard();$('story').src=c.toDataURL('image/png');
  $('share').onclick=async()=>{try{const blob=await new Promise(r=>c.toBlob(r,'image/png'));const f=new File([blob],'funky-pop.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Новогодняя карта Saule'});else{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='funky-pop.png';a.click();}}catch(e){}};}
$('back').onclick=()=>{show('map');drawMap(false);};

/* ================= start ================= */
pickerHtml();
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;heroIdx=+b.dataset.i;store.set('hero',heroIdx);pickerHtml();};
$('go').onclick=()=>{store.set('started','1');show('map');drawMap(false);if(!me.points)setTimeout(openCode,400);};
(async()=>{
  try{await ensurePlayer();}catch(e){show('start');$('go').disabled=true;$('go').textContent='Нет связи с игрой';return;}
  const qs=new URLSearchParams(location.search),c=qs.get('c');
  if(c||qs.get('p'))history.replaceState(null,'',location.pathname);
  if(c){show('map');drawMap(false);await scan(c,null);return;}
  if(store.get('started')||me.points){show('map');drawMap(false);if(me.points>=CFG.points)bubble('Карта пройдена! 🎉','ok');}else show('start');
})();
})();
